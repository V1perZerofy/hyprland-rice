# cava config for the bar visualiser (services/Cava.qml) — raw numbers on stdout.
# Separate from ~/.config/cava/config so the terminal cava is unaffected.
[general]
framerate = 30
bars = 10
autosens = 1
sleep_timer = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 70
