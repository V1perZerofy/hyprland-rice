# AirPlay (RAOP) speakers on the network (Apple TV "Wohnzimmer" etc.) show up
# as normal audio outputs: pick one in the bar's volume card.
# Needs the pipewire-zeroconf package; `ifexists nofail` keeps PipeWire
# starting normally without it.
context.modules = [
    {   name = libpipewire-module-raop-discover
        args = { }
        flags = [ ifexists nofail ]
    }
]
